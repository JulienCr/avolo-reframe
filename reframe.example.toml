# Exemple de configuration pour scripts.run et scripts.setup_scene.
# Copiez ce fichier en reframe.toml à la racine du dépôt pour qu'il soit
# chargé automatiquement (ou passez --config chemin/vers/fichier.toml).
#
# Priorité : ligne de commande > ce fichier > valeurs par défaut intégrées.
# Chaque valeur ci-dessous EST la valeur par défaut intégrée -- detector est
# laissé en commentaire pour que le défaut dépendant de la plateforme
# s'applique (voir [detector] plus bas). Sur Windows, un chemin doit utiliser
# des « / » ou des guillemets simples ("D:\dev" n'est pas un TOML valide) --
# écrivez "D:/dev/..." ou 'D:\dev\...'.

[connection]
# Utilisé par scripts.run ET scripts.setup_scene.
url = "ws://127.0.0.1:4455"
# Requis si l'authentification obs-websocket est activée. Ne committez jamais
# un vrai mot de passe : ce fichier n'est qu'un exemple.
password = ""
control_port = 4466  # port du dock de contrôle HTTP (0 pour le désactiver)

# scene n'est utilisé que par scripts.run (le nom de scène est fixe côté
# setup_scene : scripts.layout.SCENE_NAME).
scene = "AVOLO Reframe POC"

[detector]
# pose ou vision (Apple Vision, macOS uniquement) ou yolo. Défaut intégré :
# pose sur macOS, yolo ailleurs. Laissé en commentaire pour que ce défaut
# s'applique -- décommentez pour forcer un détecteur particulier.
# detector = "pose"
upper_body = false  # tête+torse au lieu du corps entier (tous détecteurs)
yolo_model = "models/yolo11m-pose.pt"  # poids YOLO11-pose (detector = yolo)

[loop]
fps = 12.0
width = 640  # largeur de décodage des captures, en pixels
duration = 0.0  # 0 = tourne jusqu'à Ctrl-C
log = ""  # vide = pas de journal JSONL
features = false  # extraction visage/pose pour l'overlay OBS (coûteux)

[policy]
margin = 0.18
min_crop_h = 960.0  # pixels d'une source 1080p, mis à l'échelle selon la hauteur de la source
dead_zone = 0.12
dwell_ms = 400.0
ease_ms = 320.0  # durée à la distance de référence (675 px d'une source 1080p, mise à l'échelle)
ease_min_ms = 180.0
ease_max_ms = 900.0
snap = false  # true = coupe instantanée, jamais de transition animée
hold_ms = 1500.0
eye_line = 0.33  # ligne des yeux visée, en fraction de la hauteur du cadre
zoom_dead_zone = 0.25  # tolérance de zoom séparée de dead_zone

[split]
split_enabled = true  # cadrage empilé à deux sujets (false = toujours seul)
split_min_gap = 0.15
split_enter_ms = 600.0
split_exit_ms = 500.0
track_hold_ms = 500.0

[source]
# scripts.setup_scene uniquement : le choix de la source RF Cam.
media_file = ""  # vide = fixture de test par défaut, sinon la caméra
camera = false  # true = force une caméra même si la fixture existe
avocam_ip = ""  # IP de l'iPhone AvoCam ; avec --camera, RF Cam devient une source AvoCam
avocam_port = 5000  # port UDP attribué à cette caméra par le contrôleur AvoCam

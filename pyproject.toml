[project]
name = "avolo-reframe"
version = "0.1.0"
description = "Live 9:16 reframing for OBS - PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "websockets>=13",
    "pillow>=10",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=12.2.2; sys_platform == 'darwin'",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

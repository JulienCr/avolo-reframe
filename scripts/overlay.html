<title>AVOLO Reframe Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #status {
    position: fixed;
    left: 12px;
    bottom: 12px;
    font: 13px/1.4 -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    background: rgba(20, 20, 20, 0.72);
    padding: 6px 10px;
    border-radius: 6px;
    display: none;
  }
</style>

<canvas id="canvas"></canvas>
<div id="status"></div>

<script>
  const params = new URLSearchParams(location.search);
  const FEATURES_URL = params.get("api") || "/api/features";
  const STATE_URL = "/api/state";
  const POLL_MS = 150;

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");

  const COLORS = {
    face: "#22d3ee",
    eyes: "#facc15",
    pupils: "#ef4444",
    mouthOuter: "#f472b6",
    mouthInner: "#fb923c",
    minor: "#9ca3af",
    joint: "#4ade80",
    bone: "#22c55e",
    shoulder: "#ff3b30",
    frame: "#60a5fa",
    deadZone: "rgba(96, 165, 250, 0.18)",
  };

  const MINOR_REGIONS = ["nose", "medianLine", "faceContour", "leftEyebrow", "rightEyebrow"];

  const SKELETON = [
    ["head", "neck_1"],
    ["neck_1", "left_shoulder_1"],
    ["neck_1", "right_shoulder_1"],
    ["left_shoulder_1", "left_forearm"],
    ["left_forearm", "left_hand"],
    ["right_shoulder_1", "right_forearm"],
    ["right_forearm", "right_hand"],
    ["neck_1", "root"],
    ["root", "left_upLeg"],
    ["left_upLeg", "left_leg"],
    ["left_leg", "left_foot"],
    ["root", "right_upLeg"],
    ["right_upLeg", "right_leg"],
    ["right_leg", "right_foot"],
    ["head", "left_eye"],
    ["head", "right_eye"],
    ["head", "left_ear"],
    ["head", "right_ear"],
  ];

  // Joints below this confidence are Vision's "not found" sentinel (0,0);
  // drawing them clutters the top-left corner with meaningless dots/lines.
  const JOINT_MIN_CONFIDENCE = 0.05;

  let lastState = null;
  let lastFeatures = null;
  let stateFailed = false;
  let featuresOff = false;
  let fetching = false;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function toPx(x, y) {
    return [x * window.innerWidth, y * window.innerHeight];
  }

  function toRectPx(r) {
    const [x, y] = toPx(r.x, r.y);
    return [x, y, r.w * window.innerWidth, r.h * window.innerHeight];
  }

  function drawLabel(text, x, y) {
    ctx.font = "13px -apple-system, 'Segoe UI', sans-serif";
    const padding = 4;
    const w = ctx.measureText(text).width + padding * 2;
    ctx.fillStyle = "rgba(15, 15, 15, 0.6)";
    ctx.fillRect(x, y - 14, w, 18);
    ctx.fillStyle = "#fff";
    ctx.fillText(text, x + padding, y);
  }

  function strokePath(points, color, width, close) {
    if (points.length < 2) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    points.forEach(([x, y], i) => (i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y)));
    if (close) ctx.closePath();
    ctx.stroke();
  }

  function drawDots(points, color, radius) {
    ctx.fillStyle = color;
    for (const [x, y] of points) {
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function regionPoints(region) {
    return (region || []).map(([x, y]) => toPx(x, y));
  }

  function drawFace(face) {
    const [x, y] = toPx(face.box[0], face.box[1]);
    const [w, h] = [face.box[2] * window.innerWidth, face.box[3] * window.innerHeight];
    ctx.strokeStyle = COLORS.face;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    const fmt = (v) => (v === null ? "?" : Math.round(v) + "°");
    drawLabel(`lacet ${fmt(face.yaw_deg)} · tangage ${fmt(face.pitch_deg)} · roulis ${fmt(face.roll_deg)}`, x, y - 6);

    const regions = face.regions || {};
    drawDots(regionPoints(regions.leftEye), COLORS.eyes, 2.5);
    drawDots(regionPoints(regions.rightEye), COLORS.eyes, 2.5);
    drawDots(regionPoints(regions.leftPupil), COLORS.pupils, 3.5);
    drawDots(regionPoints(regions.rightPupil), COLORS.pupils, 3.5);
    strokePath(regionPoints(regions.outerLips), COLORS.mouthOuter, 2, true);
    strokePath(regionPoints(regions.innerLips), COLORS.mouthInner, 1.5, true);
    for (const name of MINOR_REGIONS) {
      drawDots(regionPoints(regions[name]), COLORS.minor, 1.5);
    }
  }

  function drawBody(body) {
    const joints = body.joints || {};
    const confident = (name) => {
      const j = joints[name];
      return j && j[2] >= JOINT_MIN_CONFIDENCE ? j : null;
    };

    for (const [a, b] of SKELETON) {
      const ja = confident(a);
      const jb = confident(b);
      if (!ja || !jb) continue;
      strokePath([toPx(ja[0], ja[1]), toPx(jb[0], jb[1])], COLORS.bone, 2, false);
    }

    for (const joint of Object.values(joints)) {
      const [x, y, conf] = joint;
      if (conf < JOINT_MIN_CONFIDENCE) continue;
      const [px, py] = toPx(x, y);
      ctx.globalAlpha = 0.25 + conf * 0.75;
      drawDots([[px, py]], COLORS.joint, 2 + conf * 3);
      ctx.globalAlpha = 1;
    }

    const left = confident("left_shoulder_1");
    const right = confident("right_shoulder_1");
    if (left && right && body.shoulder_angle_deg !== null) {
      const p1 = toPx(left[0], left[1]);
      const p2 = toPx(right[0], right[1]);
      strokePath([p1, p2], COLORS.shoulder, 4, false);
      const midX = (p1[0] + p2[0]) / 2;
      const midY = (p1[1] + p2[1]) / 2;
      drawLabel(`épaules ${Math.round(body.shoulder_angle_deg)}°`, midX, midY - 10);
    }
  }

  // Box centered on rect where _moved() would not yet commit a re-frame:
  // +/- dead_zone * rect size, the same formula core.policy applies in px.
  function drawDeadZone(rect, deadZone) {
    if (!deadZone) return;
    const cx = rect.x + rect.w / 2;
    const cy = rect.y + rect.h / 2;
    const zone = { x: cx - rect.w * deadZone, y: cy - rect.h * deadZone, w: rect.w * deadZone * 2, h: rect.h * deadZone * 2 };
    const [x, y, w, h] = toRectPx(zone);
    ctx.fillStyle = COLORS.deadZone;
    ctx.fillRect(x, y, w, h);
  }

  function drawFrameRect(rect, deadZone, label) {
    drawDeadZone(rect, deadZone);
    const [x, y, w, h] = toRectPx(rect);
    ctx.strokeStyle = COLORS.frame;
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 4]);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    if (label) drawLabel(label, x + 6, y + 18);
  }

  function drawModeLabel(mode, detectorName) {
    const text = `mode ${mode} · détecteur ${detectorName}`;
    ctx.font = "13px -apple-system, 'Segoe UI', sans-serif";
    const w = ctx.measureText(text).width + 8;
    const x = window.innerWidth - w - 18;
    drawLabel(text, x, 20);
  }

  function drawFraming(state) {
    if (!state) return;
    const deadZone = (state.params || {}).dead_zone || 0;
    if (state.mode === "split" && state.cells) {
      drawFrameRect(state.cells[0], deadZone, "Haut");
      drawFrameRect(state.cells[1], deadZone, "Bas");
    } else if (state.crop) {
      drawFrameRect(state.crop, deadZone, null);
    }
    drawModeLabel(state.mode || "single", state.detector || "?");
  }

  function drawLegend() {
    const items = [
      [COLORS.face, "Visage"],
      [COLORS.eyes, "Yeux / pupilles"],
      [COLORS.mouthOuter, "Bouche"],
      [COLORS.joint, "Corps"],
      [COLORS.shoulder, "Épaules"],
      [COLORS.frame, "Cadrage"],
      [COLORS.deadZone, "Zone morte"],
    ];
    const x0 = 12;
    let y = 20;
    ctx.font = "12px -apple-system, 'Segoe UI', sans-serif";
    const width = 130;
    ctx.fillStyle = "rgba(15, 15, 15, 0.55)";
    ctx.fillRect(x0 - 6, y - 14, width, items.length * 18 + 6);
    for (const [color, label] of items) {
      ctx.fillStyle = color;
      ctx.fillRect(x0, y - 8, 10, 10);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, x0 + 16, y);
      y += 18;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    drawFraming(lastState);
    for (const face of (lastFeatures || {}).faces || []) drawFace(face);
    for (const body of (lastFeatures || {}).bodies || []) drawBody(body);
    drawLegend();
  }

  function updateStatus() {
    if (stateFailed) {
      statusEl.textContent = "Serveur injoignable — nouvelle tentative…";
    } else if (featuresOff) {
      statusEl.textContent = "Traits désactivés — relancez la boucle avec --features";
    } else {
      statusEl.style.display = "none";
      return;
    }
    statusEl.style.display = "block";
  }

  // The essential endpoint: its failure is the real "server unreachable"
  // case, distinct from --features simply being off (see pollFeatures).
  async function pollState() {
    try {
      const res = await fetch(STATE_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      lastState = await res.json();
      stateFailed = false;
    } catch {
      stateFailed = true;
    }
  }

  async function pollFeatures() {
    try {
      const res = await fetch(FEATURES_URL, { cache: "no-store" });
      // A reachable server answering 503 means --features is off, not that
      // the server is down: the framing layer must still draw normally.
      if (res.status === 503) {
        lastFeatures = null;
        featuresOff = true;
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      lastFeatures = await res.json();
      featuresOff = false;
    } catch {
      lastFeatures = null;
      featuresOff = true;
    }
  }

  async function pollOnce() {
    if (fetching) return;
    fetching = true;
    await Promise.all([pollState(), pollFeatures()]);
    updateStatus();
    draw();
    fetching = false;
  }

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  pollOnce();
  setInterval(pollOnce, POLL_MS);
</script>
